apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: ivolve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/clouddevops-auth:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ivolve-config
            - secretRef:
                name: ivolve-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: ivolve
spec:
  selector:
    app: auth
  ports:
    - port: 5000
      targetPort: 5000
